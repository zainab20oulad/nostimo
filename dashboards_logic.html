<style>

*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:var(--ink);font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.brand{font-family:Georgia,serif;font-size:27px;color:var(--brown);letter-spacing:1px;white-space:nowrap}.brand b{color:var(--olive);font-size:30px}.top-right{display:flex;align-items:center;gap:12px}.role-select{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:white;color:var(--brown)}.avatar{width:38px;height:38px;border-radius:50%;background:var(--olive);color:white;display:grid;place-items:center;font-weight:700}.shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 72px)}.sidebar{background:var(--brown);color:#fff;padding:25px 16px;display:flex;flex-direction:column;gap:8px}.side-brand{font:22px Georgia,serif;padding:0 12px 20px;color:#f4e9d9}.role-label{font-size:10px;letter-spacing:1.8px;color:#c8b7a7;text-transform:uppercase;padding:10px 12px 6px}.nav-btn{border:0;background:transparent;color:#e9dfd5;text-align:left;padding:12px;border-radius:9px;display:flex;gap:11px;align-items:center;font-size:13px}.nav-btn:hover,.nav-btn.active{background:var(--olive);color:#fff}.nav-icon{width:19px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;padding:15px 12px;color:#c8b7a7;font-size:11px;border-top:1px solid #ffffff20}.main{padding:30px 34px 55px;min-width:0}.breadcrumb{color:var(--muted);font-size:12px;margin-bottom:12px}.heading-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:25px}.page-title{font: bold 32px Georgia,serif;color:var(--brown);margin:0 0 7px}.subtitle{color:var(--muted);font-size:13px;margin:0}.btn{border:0;border-radius:8px;background:var(--brown);color:white;padding:11px 17px;font-weight:600;font-size:12px}.btn:hover{background:var(--brown2)}.btn.olive{background:var(--olive)}.btn.olive:hover{background:var(--olive-dark)}.btn.light{background:#f0e8de;color:var(--brown)}.btn.rose{background:var(--rose);color:var(--brown)}.btn.small{padding:8px 11px;font-size:11px}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}.stat,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:19px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:34px;height:34px;border-radius:10px;background:var(--cream);display:grid;place-items:center}.stat-value{font: bold 27px Georgia,serif;color:var(--brown);margin:13px 0 4px}.stat-note{font-size:11px;color:var(--olive-dark)}.two-col{grid-template-columns:1.45fr 1fr}.three-col{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{padding:21px;margin-bottom:18px}.panel h2,.panel h3{font-family:Georgia,serif;color:var(--brown);margin:0 0 17px}.panel h2{font-size:21px}.panel h3{font-size:17px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel-head h2,.panel-head h3{margin:0}.muted{color:var(--muted)}.smalltext{font-size:11px;color:var(--muted)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:570px}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:12px 10px;border-bottom:1px solid var(--line)}td{padding:14px 10px;border-bottom:1px solid #f2eee9;font-size:12px}tr:last-child td{border-bottom:0}.status{display:inline-flex;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:700;background:#edf1e7;color:#62744e}.status.pending{background:#fff2dc;color:#a87932}.status.progress{background:#eaf0f8;color:#55718f}.status.cancel{background:#f8e9e7;color:#a65c55}.status.neutral{background:#f1eee9;color:#7b7066}.search{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;min-width:190px;font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.product-row{display:flex;align-items:center;gap:12px}.product-img{width:54px;height:54px;border-radius:10px;background:var(--sand);display:grid;place-items:center;font-size:27px}.bar{height:8px;background:#f0ece6;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--olive);border-radius:10px}.activity{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.activity:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;background:var(--olive);margin-top:4px;flex:none}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:11px;font-weight:700;color:#62584f}.field input,.field select,.field textarea{border:1px solid #e5ddd3;border-radius:8px;padding:11px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:95px;resize:vertical}.field.full{grid-column:1/-1}.product-hero{display:grid;grid-template-columns: minmax(250px,.9fr) 1.1fr;gap:28px;align-items:center}.product-photo{min-height:330px;border-radius:16px;background:linear-gradient(145deg,#eadcc7,#f6eee3);display:grid;place-items:center;font-size:130px}.price{font: bold 25px Georgia,serif;color:var(--brown)}.tag{display:inline-block;padding:6px 9px;border-radius:20px;background:#eef1e8;color:var(--olive-dark);font-size:10px;margin:4px 4px 4px 0}.qty{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:8px;padding:7px;width:max-content}.qty button{border:0;background:transparent;font-size:17px;color:var(--brown)}.support-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.ticket{padding:14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}.ticket-top{display:flex;justify-content:space-between;gap:10px}.profile-card{background:var(--olive);color:white;border-radius:13px;padding:24px;text-align:center}.profile-circle{width:68px;height:68px;border-radius:50%;background:#566542;margin:0 auto 12px;display:grid;place-items:center;font-size:24px;font-weight:700}.quick-link{padding:14px;border-radius:10px;background:#faf7f2;border:1px solid var(--line);font-size:12px}.footer-note{color:var(--muted);font-size:10px;margin-top:25px;text-align:center}.mobile-menu{display:none}
@media(max-width:950px){.shell{grid-template-columns:205px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.main{padding:24px 20px}.two-col,.support-layout{grid-template-columns:1fr}}
@media(max-width:650px){.topbar{padding:0 14px;height:62px}.brand{font-size:22px}.mobile-menu{display:block;border:0;background:none;font-size:22px;color:var(--brown)}.shell{display:block}.sidebar{display:none;position:fixed;z-index:8;top:62px;bottom:0;width:260px;overflow:auto}.sidebar.open{display:flex}.main{padding:22px 14px}.heading-row{flex-direction:column}.page-title{font-size:27px}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px}.stat-value{font-size:22px}.three-col,.product-hero{grid-template-columns:1fr}.product-photo{min-height:230px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}

/* Added interface details */
.field input[type="file"]{padding:9px;background:#faf7f2}
.field input[type="checkbox"]{width:auto;accent-color:var(--olive)}
.quick-link .stat-value{font-size:23px}
@media(max-width:650px){.toolbar{align-items:stretch}.toolbar .search{min-width:0;flex:1}}

/* Top navigation shared by every Nóstimo role */
.topbar{height:76px;padding:0 4.2%;gap:28px;display:flex;align-items:center}
.brand{flex:0 0 auto}
.top-navigation{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2.4vw,36px);flex:1;min-width:0}
.top-nav-link{border:0;background:transparent;color:#5d5148;padding:12px 2px;font-size:13px;white-space:nowrap;position:relative}
.top-nav-link:hover,.top-nav-link.active{color:var(--brown);font-weight:700}
.top-nav-link.active:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--olive);border-radius:2px}
.top-right{flex:0 0 auto;gap:10px}
.mobile-menu{display:grid;place-items:center;width:42px;height:42px;border:0;background:transparent;color:var(--brown);font-size:26px;line-height:1;cursor:pointer}
.shell{display:block;min-height:calc(100vh - 76px)}
.main{max-width:1500px;margin:0 auto;padding:30px 4.2% 55px}
.sidebar{display:none;position:fixed;z-index:20;top:76px;right:3.8%;left:auto;width:min(330px,92vw);max-height:calc(100vh - 92px);overflow:auto;background:#fff;color:var(--ink);padding:14px;border:1px solid var(--line);border-radius:0 0 14px 14px;box-shadow:0 14px 35px #38271924;gap:4px}
.sidebar.open{display:flex}
.menu-heading{display:flex;justify-content:space-between;align-items:center;padding:5px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-heading .role-label{color:var(--muted);padding:0;font-size:10px}
.menu-close{border:0;background:transparent;color:var(--brown);font-size:24px;cursor:pointer}
.sidebar .nav-btn{color:var(--brown);padding:11px 12px}
.sidebar .nav-btn:hover,.sidebar .nav-btn.active{background:#eef1e8;color:var(--olive-dark)}
.sidebar .side-bottom{color:var(--muted);border-top:1px solid var(--line);margin-top:10px}
@media(max-width:850px){.topbar{gap:14px;padding:0 18px}.top-navigation{gap:14px}.top-nav-link{font-size:12px}.role-select{max-width:135px}}
@media(max-width:650px){.topbar{height:64px;padding:0 14px;gap:8px}.brand{font-size:22px}.brand b{font-size:25px}.top-navigation{justify-content:flex-start;gap:12px;overflow-x:auto;scrollbar-width:none}.top-navigation::-webkit-scrollbar{display:none}.top-nav-link{font-size:11px;padding:10px 0}.top-right{gap:5px}.role-select{max-width:112px;padding:8px 5px;font-size:10px}.avatar{width:30px;height:30px;font-size:11px}.mobile-menu{display:grid;width:34px;font-size:24px}.shell{min-height:calc(100vh - 64px)}.sidebar{top:64px;right:10px}.main{padding:22px 14px 45px}}
@media(max-width:420px){.topbar{flex-wrap:wrap;height:auto;min-height:64px;padding:8px 12px}.brand{font-size:20px}.top-navigation{order:3;flex-basis:100%;justify-content:center;overflow:visible;gap:clamp(12px,4vw,20px)}.top-nav-link{font-size:11px}.top-right{margin-left:auto}.sidebar{top:100px}}
</style></head>
<body>
<header class="topbar"><div class="brand"><b>◉</b>Nóstimo</div><nav class="top-navigation" id="topNavigation" aria-label="Main navigation"></nav><div class="top-right"><select class="role-select" id="roleSelect" onchange="changeRole(this.value)" aria-label="Switch interface"><option value="client">Client interface</option><option value="worker">Worker interface</option><option value="deliverer">Deliverer interface</option><option value="admin">Admin interface</option></select><div class="avatar" id="avatar">ZO</div><button class="mobile-menu" onclick="toggleMenu()" aria-label="Open menu" aria-expanded="false" title="More pages">☰</button></div></header>
<div class="shell"><aside class="sidebar" id="sidebar"><div class="menu-heading"><span class="role-label" id="roleLabel">CLIENT WORKSPACE</span><button class="menu-close" onclick="toggleMenu()" aria-label="Close menu">×</button></div><nav id="navigation" aria-label="More pages"></nav><div class="side-bottom">Made with love by Nóstimo<br>Prototype · Demo data only</div></aside><main class="main" id="main"></main></div>
<script>
const menus={
client:[['Home','⌂'],['Products','▧'],['Product Details','◇'],['Favorites','♡'],['My Cart','🛒'],['Checkout','▣'],['Card Payment','▣'],['My Orders','▤'],['Reviews','☆'],['Order Details','☷'],['Track Delivery','➜'],['My Addresses','⌖'],['Customer Support','♡'],['My Profile','◉'],['Login','↪'],['Register','＋'],['Forgot Password','?'],['Reset Password','✦']],
worker:[['Dashboard','⌂'],['Available Orders','＋'],['Assigned Orders','▤'],['Order History','◷'],['Availability','◉'],['Profile','♙']],
deliverer:[['Dashboard','⌂'],['Available Deliveries','＋'],['My Deliveries','➜'],['Delivery History','◷'],['Availability','◉'],['Profile','♙']],
admin:[['Dashboard','⌂'],['Users','♙'],['Employees','♧'],['Products','▧'],['Categories','▦'],['Weekly Specials','✦'],['Orders','▤'],['Assignments','⇄'],['Deliveries','➜'],['Payments','＄'],['Analytics','▥'],['Support','♡'],['Settings','⚙'],['Admin Profile','◉']]
};
let role='client',page='Home';
let availableOrders=[
 {id:'#NS-1050',client:'Salma R.',items:'3 items',received:'11:05',status:'Waiting for worker'},
 {id:'#NS-1049',client:'Aya N.',items:'2 items',received:'10:58',status:'Waiting for worker'}
];
let workerOrders=[
 {
   id:'#NS-1048',
   client:'Meriem A.',
   items:'5 items',
   received:'10:42',
   status:'Preparing',
   fulfillment:'Delivery'
 },
 {
   id:'#NS-1047',
   client:'Yasmine B.',
   items:'2 items',
   received:'10:18',
   status:'Ready',
   fulfillment:'Pickup'
 }
];
let availableDeliveries=[
 {id:'#NS-1047',client:'Yasmine B.',address:'Centre-ville, Tétouan',ready:'10:18',status:'Ready for pickup'},
 {id:'#NS-1046',client:'Sara M.',address:'Mhannech, Tétouan',ready:'10:12',status:'Ready for pickup'}
];
let myDeliveries=[
 {id:'#NS-1048',client:'Meriem A.',address:'Centre-ville, Tétouan',ready:'10:45',status:'Out for delivery'}
];
let userRoles=[
 {name:'Meriem A.',email:'meriem@email.com',role:'Client',status:'Active'},
 {name:'Yasmine B.',email:'yasmine@email.com',role:'Client',status:'Active'},
 {name:'Nadia E.',email:'nadia@nostimo.bake',role:'Worker',status:'Active'},
 {name:'Omar K.',email:'omar@nostimo.bake',role:'Deliverer',status:'Active'}
];
const orders=[['#NS-1048','Meriem A.','5 items','$28.45','Preparing','Today, 10:42'],['#NS-1047','Yasmine B.','2 items','$13.98','Ready','Today, 10:18'],['#NS-1046','Sara M.','3 items','$19.50','Delivered','Yesterday'],['#NS-1045','Aya N.','1 item','$4.99','Pending','Yesterday']];
// Demo reviews. In a real application these records must be stored in the database.
let storeReviews=[
 {name:'Meriem A.',rating:5,text:'Everything was fresh and beautifully packed. I will order again!',date:'Recently'},
 {name:'Aya N.',rating:4,text:'Lovely cookies and friendly service.',date:'Recently'}
];
let productReviews={
 'Red Velvet Cookie':[
  {name:'Sara M.',rating:5,text:'Soft, rich and delicious. The white chocolate is perfect.'},
  {name:'Meriem A.',rating:4,text:'Really good texture and flavour.'}
 ]
};
let deliveredProducts=[
 {order:'#NS-1039',product:'Red Velvet Cookie',delivered:true},
 {order:'#NS-1039',product:'Matcha & White Chocolate Cookie',delivered:true},
 {order:'#NS-1024',product:'Golden Brownie',delivered:true}
];
let submittedStoreReview=false;
let submittedProductReviews=[];

const deliveries=[['#NS-1048','Meriem A.','Centre-ville, Tétouan','10:45','Out for delivery'],['#NS-1042','Salma R.','Mhannech, Tétouan','11:20','Assigned'],['#NS-1039','Aya N.','Martil, Morocco','Yesterday','Delivered']];
const primaryNavigation={
  client:['Home','Products','My Orders','Reviews'],
  worker:['Dashboard','Available Orders','Order History'],
  deliverer:['Dashboard','Available Deliveries','Delivery History'],
  admin:['Dashboard','Orders','Analytics']
};
function toggleMenu(){
  const menu=document.getElementById('sidebar');
  const button=document.querySelector('.mobile-menu');
  const opened=menu.classList.toggle('open');
  if(button)button.setAttribute('aria-expanded',String(opened));
}
function changeRole(r){role=r;page=menus[r][0][0];document.getElementById('avatar').textContent={client:'ZO',worker:'WK',deliverer:'DL',admin:'AD'}[r];document.getElementById('roleLabel').textContent=r.toUpperCase()+' — MORE PAGES';document.getElementById('sidebar').classList.remove('open');render()}
function go(p){page=p;document.getElementById('sidebar').classList.remove('open');const button=document.querySelector('.mobile-menu');if(button)button.setAttribute('aria-expanded','false');render()}
function nav(){
  const primary=primaryNavigation[role]||[];
  document.getElementById('topNavigation').innerHTML=primary.map(p=>`<button class="top-nav-link ${page===p?'active':''}" onclick="go('${p.replace(/'/g,"\\'")}')">${p==='Products'?'Menu':p==='Weekly Specials'?'Special':p}</button>`).join('');
  document.getElementById('navigation').innerHTML=menus[role].filter(([p])=>!primary.includes(p)).map(([p,i])=>`<button class="nav-btn ${page===p?'active':''}" onclick="go('${p.replace(/'/g,"\\'")}')"><span class="nav-icon">${i}</span>${p}</button>`).join('');
}
function heading(title,sub,action=''){return `<div class="breadcrumb">${role[0].toUpperCase()+role.slice(1)} / ${title}</div><div class="heading-row"><div><h1 class="page-title">${title}</h1><p class="subtitle">${sub||'Manage and follow your Nóstimo workspace.'}</p></div>${action}</div>`}
function stats(items){return `<div class="grid stats">${items.map(([label,value,note,icon])=>`<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`).join('')}</div>`}
function panel(title,content,extra=''){return `<section class="panel"><div class="panel-head"><h2>${title}</h2>${extra}</div>${content}</section>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function status(s){let c=s.toLowerCase().includes('deliver')?'':s.toLowerCase().includes('prepar')||s.toLowerCase().includes('progress')||s.toLowerCase().includes('out for')?'progress':s.toLowerCase().includes('pending')||s.toLowerCase().includes('assigned')||s.toLowerCase().includes('ready')?'pending':'neutral';return `<span class="status ${c}">${s}</span>`}
function activities(items){return items.map(x=>`<div class="activity"><span class="dot"></span><div>${x}<div class="smalltext">A few minutes ago</div></div></div>`).join('')}
function dashboard(kind){
let data=kind==='Worker'?[['Assigned today','08','2 orders completed','▤'],['In preparation','03','Keep orders moving','◷'],['Ready for pickup','02','Awaiting deliverer','✓'],['Availability','Online','Accepting assignments','◉']]:kind==='Deliverer'?[['Assigned deliveries','05','2 completed today','➜'],['To pick up','02','At the bakery','▣'],['In transit','01','On the way','⌖'],['Completed today','02','Great work','✓']]:[['Total orders','248','+12% this month','▤'],['Revenue','$4,820','+8.4% this month','＄'],['Active clients','186','+14 this month','♙'],['Products','24','3 categories','▧']];
let recent=kind==='Worker'?[['#NS-1048','Meriem A.','5 items',status('Preparing'),'10:42'],['#NS-1047','Yasmine B.','2 items',status('Ready'),'10:18'],['#NS-1043','Salma R.','3 items',status('Pending'),'09:55']]:kind==='Deliverer'?[['#NS-1048','Meriem A.','Centre-ville',status('Out for delivery'),'10:45'],['#NS-1042','Salma R.','Mhannech',status('Assigned'),'11:20'],['#NS-1039','Aya N.','Martil',status('Delivered'),'Yesterday']]:orders.slice(0,3).map(o=>[o[0],o[1],o[2],status(o[4]),o[5]]);
let target=kind==='Admin'?'Orders':kind==='Worker'?'Assigned Orders':'My Deliveries';
return heading(kind+' Dashboard',kind==='Admin'?'A clear overview of your bakery operations.':`Welcome back. Here is your ${kind.toLowerCase()} activity at a glance.`)+stats(data)+`<div class="grid two-col">${panel(kind==='Admin'?'Recent Orders':kind==='Worker'?'Orders to Prepare':'Upcoming Deliveries',table(['Reference','Customer','Details','Status','Time'],recent),`<button class="btn light small" onclick="go('${target}')">View all</button>`)}${panel('Recent Activity',activities(kind==='Admin'?['New order received — #NS-1048','A new client registered','Golden Brownie stock updated']:kind==='Worker'?['Order #NS-1047 marked ready','New order assigned to you','Availability set to online']:['Delivery #NS-1039 completed','New delivery assigned','Pickup confirmed']))}</div>`;

function acceptWorkerOrder(id){
 const i=availableOrders.findIndex(o=>o.id===id); if(i<0)return;
 const o=availableOrders.splice(i,1)[0];o.status='Preparing';workerOrders.unshift(o);

}
function acceptDelivery(id){
 const i=availableDeliveries.findIndex(o=>o.id===id);if(i<0)return;
 const o=availableDeliveries.splice(i,1)[0];o.status='Out for delivery';myDeliveries.unshift(o);
 toast('Delivery '+id+' assigned to you.');render();
}
function updateWorkerOrder(id){
 const o=workerOrders.find(x=>x.id===id);if(!o)return;
 o.status='Ready for pickup';toast(id+' marked as prepared and ready for pickup.');render();
}
function confirmPickup(id) {
  const o = workerOrders.find(x => x.id === id);
  if (!o || o.fulfillment !== 'Pickup') return;

  const p = getOrderPayment(id);

  if (p && /cash/i.test(p.method)) {
    p.status = 'Paid';
    p.collector = 'Nadia E.';
    p.date = 'Today';
  }

  o.status = 'Picked up';

  toast('Pickup confirmed. Payment status updated.');
  render();
}
function updateDelivery(id){
 const o=myDeliveries.find(x=>x.id===id);if(!o)return;
 o.status='Delivered';toast(id+' marked as delivered.');render();
}
function getOrderPayment(orderId) {
  return staffState.payments.find(p => p.order === orderId);
}

function getPaymentMethod(orderId) {
  const p = getOrderPayment(orderId);
  if (!p) return 'Not recorded';

  if (/card|online/i.test(p.method)) return 'Card / Online';
  if (/cash/i.test(p.method)) return 'Cash';

  return p.method;
}

function getPaymentStatus(orderId) {
  const p = getOrderPayment(orderId);
  if (!p) return 'Not recorded';

  return p.status === 'Paid' ? 'Paid' : 'Unpaid';
}

function orderStaffAttribution(orderId){
  const prepared=staffState.workerHistory.find(x=>x.id===orderId);
  const delivered=staffState.deliveryHistory.find(x=>x.id===orderId && x.outcome==='Delivered');
  return {
    worker: prepared?.worker || (prepared ? 'Nadia E.' : 'Not recorded'),
    deliverer: delivered?.deliverer || (delivered ? 'Omar K.' : 'Not delivered')
  };
}

function workerPage() {
  if (page === 'Dashboard') return dashboard('Worker');

  if (page === 'Available Orders') {
    return availableOrdersPage();
  }

  if (page === 'Assigned Orders') {
    return listPage(
      page,
      'Prepare orders and confirm customer pickups.',
      ['Order', 'Customer', 'Items', 'Status', 'Payment', 'Action'],
      workerOrders.map(o => {
        const payment = getOrderPayment(o.id);
        let action = '';

        if (o.fulfillment === 'Pickup' && o.status === 'Ready for pickup') {
          action = `<button class="btn small olive"
            onclick="confirmPickup('${o.id}')">
            Confirm customer pickup
          </button>`;
        } else if (
          o.status !== 'Ready for pickup' &&
          o.status !== 'Picked up'
        ) {
          action = `<button class="btn small"
            onclick="updateWorkerOrder('${o.id}')">
            Mark as prepared
          </button>`;
        } else {
          action = '<span class="smalltext">Completed</span>';
        }

        return [
          o.id,
          o.client,
          o.items,
          status(o.status),
          status(payment?.status || 'Unpaid'),
          action
        ];
      })
    );
  }

  if (page === 'Order History') {
  return listPage(
    page,
    'Monitor orders, staff assignments and payment information.',
    [
      'Order',
      'Client',
      'Items',
      'Prepared by (Worker)',
      'Delivered by (Deliverer)',
      'Payment Method',
      'Payment Status',
      'Total',
      'Order Status',
      'Date'
    ],
    orders.map(o => {
      const a = orderStaffAttribution(o[0]);

      return [
        o[0],
        o[1],
        o[2],
        a.worker,
        a.deliverer,
        getPaymentMethod(o[0]),
        status(getPaymentStatus(o[0])),
        o[3],
        status(o[4]),
        o[5]
      ];
    })
  );
}

  if (page === 'Support') return workerSupportPage();
  if (page === 'Availability') return availability();

  return profile('Profile');
}

function updateWorkerOrder(id){
  const o=workerOrders.find(x=>x.id===id);if(!o)return;
  if(o.status!=='Ready for pickup'){
    o.status='Ready for pickup';
    staffState.workerHistory.unshift({id:o.id,client:o.client,items:o.items,date:'06 Nov 2026',outcome:'Prepared',worker:'Nadia E.',deliverer:'Not delivered'});
  }
  toast(id+' marked as prepared and added to your work history.');render();
}
function updateDelivery(id,cashReceived=false){
  const o=myDeliveries.find(x=>x.id===id);if(!o)return;
  o.status='Delivered';
  if(o.paymentMethod==='Cash on delivery'){
    o.paymentStatus=cashReceived?'Paid':'Unpaid';
    let p=staffState.payments.find(x=>x.order===id);
    if(!p){p={id:'#PAY-'+String(3000+staffState.payments.length+1),order:id,method:'Cash on delivery',amount:o.amount||0,status:'Unpaid',collector:'Omar K.',date:'Today'};staffState.payments.unshift(p);}
    p.status=cashReceived?'Paid':'Unpaid';p.collector='Omar K.';p.date='Today';
  } else o.paymentStatus='Paid';
  staffState.deliveryHistory.unshift({id:o.id,client:o.client,address:o.address,date:'06 Nov 2026',outcome:'Delivered',deliverer:'Omar K.',paymentMethod:o.paymentMethod||'Card',paymentStatus:o.paymentStatus||'Paid'});
  toast(cashReceived?'Delivery completed. Cash received and payment marked PAID.':'Delivery marked as completed.');render();
}

function resolveStaffTicket(id){
  const t=staffState.tickets.find(x=>x.id===id);if(t)t.status='Resolved';toast('Support ticket marked resolved.');render();
}
function clientProducts(){
  const items=staffState.products.filter(p=>p.availability!=='Hidden');
  return heading('Menu','Explore our freshly prepared cookies, brownies and drinks.',`<button class="btn olive" onclick="go('My Cart')">View cart</button>`)
  + ['Cookies','Brownies','Drinks','Other'].map(cat=>{const group=items.filter(p=>p.category===cat);if(!group.length)return '';return `<div class="panel"><h2>${cat}</h2><div class="grid three-col">${group.map(p=>`<div class="quick-link" style="text-align:center"><div style="font-size:48px">${p.image?`<img src="${p.image}" alt="${p.name}" style="width:100%;height:130px;object-fit:cover;border-radius:9px">`:'🍪'}</div><b>${p.name}</b><p class="smalltext">${p.description||''}</p><p class="price" style="font-size:18px">${Number(p.price).toFixed(2)} MAD</p><button class="btn small" onclick="toast('${p.name.replace(/'/g,"\\'")} added to cart.')">Add to cart</button></div>`).join('')}</div></div>`;}).join('');
}

/* Add realistic payment metadata to the demo deliveries. */
myDeliveries.forEach(o=>{o.paymentMethod=o.paymentMethod||'Cash on delivery';o.paymentStatus=o.paymentStatus||'Unpaid';o.amount=o.amount||28.45;});

render();
</script></body></html>
